# QuickFIX/J narrates every session event; useful when debugging the engine,
# noise when watching business flow. Warn by default, raise per package when
# the session layer itself is under investigation.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.quickfix=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
