# Use this version until you have a real domain + TLS certificate.
# Swap docker-compose.prod.yml's nginx volume mount to this file, then follow
# deploy/README.md's "Adding HTTPS later" section once you register a domain.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # This link runs at ~15KB/s, which makes an uncompressed 1.6MB script a
    # two-minute wait. Text compresses well enough to make the difference
    # between a monitor that loads and one nobody waits for.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json
               application/javascript text/javascript;

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NEXUM monitor, added to TangoMaster's existing server block.
    #
    # Mounted under /nexum/ because /api/ in that block already belongs to
    # TangoMaster's backend. The monitor's page uses relative paths and a <base>
    # tag precisely so it can live under a prefix.
    #
    # Reached over the host gateway rather than a container name: nginx is on
    # tangomaster_default and NEXUM has its own network. Joining them would couple
    # two applications that have no reason to know about each other.

    location /nexum/ {
        proxy_pass http://172.17.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Without this a request for /nexum (no slash) redirects to a bare /,
        # which lands on TangoMaster.
        proxy_redirect ~^/(.*)$ /nexum/$1;
    }

    # A bare /nexum must reach /nexum/ or the relative paths resolve one level up.
    location = /nexum {
        return 301 /nexum/;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
