services:
  nexum:
    image: nexum:0.1.0
    restart: unless-stopped
    ports:
      # FIX acceptor, reachable from outside. Guarded by the logon policy in
      # nexum.yaml — CompIDs are not a credential, so this port is only as safe
      # as that password and the security group in front of it.
      - "0.0.0.0:9880:9880"
      # Monitor. Bound to the docker bridge gateway rather than 127.0.0.1,
      # because nginx runs in a container on another network and cannot reach
      # the host loopback. Still not public — the bridge is host-internal, and
      # nginx remains the only way in from outside.
      - "172.17.0.1:8080:8080"
    volumes:
      # The configuration carries the logon password, so it is mounted from the
      # host rather than baked into the image, and read-only.
      - /etc/nexum/nexum.yaml:/etc/nexum/nexum.yaml:ro
      # Order journal and FIX logs. An order journal lost with the container
      # cannot be recovered, and recovering open orders is what it is for.
      - nexum_data:/var/lib/nexum
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/orders >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # This host has 1.6GB total and another application on it. Without a limit
    # a JVM will size its heap against the whole machine.
    mem_limit: 420m

volumes:
  nexum_data:
